<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --nav-height: 108px;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .font-display {
        font-family: "Fraunces", ui-serif, Georgia, serif;
        font-optical-sizing: auto;
        font-variation-settings: "SOFT" 50;
      }
      .site-nav {
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.3s ease, background-color 0.3s ease;
        will-change: transform;
      }
      .site-nav.scrolled {
        background-color: rgba(255, 255, 255, 0.85);
        backdrop-filter: saturate(180%) blur(12px);
        -webkit-backdrop-filter: saturate(180%) blur(12px);
        box-shadow: 0 4px 20px -8px rgba(225, 29, 72, 0.15);
      }
      .site-nav.nav-hidden {
        transform: translateY(-100%);
      }
    </style>

    <title>{% block title %}{% endblock %} · BetterTALOS</title>
  </head>
  <body class="bg-white text-gray-900">
    <header>
      <nav id="site-nav"
        class="site-nav bg-white fixed w-full top-0 start-0 border-b border-teal-500 z-50">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
          <a href="/"
            class="flex items-center space-x-3 rtl:space-x-reverse group">
            <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fstatic.vecteezy.com%2Fsystem%2Fresources%2Fpreviews%2F051%2F958%2F130%2Fnon_2x%2Fcute-koala-bear-clinging-to-a-tree-branch-isolated-on-transparent-background-highlighting-its-natural-habitat-and-adorable-features-png.png&f=1&nofb=1&ipt=45f2fd2fb09a81fd3eb8e57e6b7fc8b2b6fb5a62d0943cd63c326b362401577b"
              class="h-20 transition-transform duration-300 group-hover:scale-105"
              alt="koala"/>
            <span class="font-display self-center text-2xl font-semibold whitespace-nowrap text-gray-900 group-hover:text-teal-500 transition-colors">koalas<span class="text-teal-500">.</span>me</span>
          </a>
          <div id="navbar-default">
<ul class="font-medium flex md:flex-row md:space-x-8 rtl:space-x-reverse items-center text-sm">
              <li>
                <a href="https://github.com/acimpoiesu/koalas" class="text-gray-600 hover:text-teal-500 transition-all flex items-center hover:scale-105" aria-label="GitHub">
                  <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482C19.138 20.197 22 16.442 22 12.017 22 6.484 17.522 2 12 2z" />
                  </svg>
                </a>
              </li>
              {% if not session['username'] %}
              <li>
                <a href="/auth/login" class="text-gray-600 hover:text-teal-500 transition-colors">Log In</a>
              </li>
              <li>
                <a href="/auth/register" class="bg-teal-500 hover:bg-teal-600 text-white px-4 py-2 rounded-full transition-all hover:shadow-md hover:shadow-teal-200">Register</a>
              </li>
              {% else %}
              <li>
                <a href="{{ url_for('disp_planner') }}" class="text-gray-600 hover:text-teal-500 transition-colors">Planner</a>
              </li>
              <li>
                <a href="{{ url_for('disp_prereq_graph') }}" class="text-gray-600 hover:text-teal-500 transition-colors">Graph</a>
              </li>
              <li>
                <a href="{{ url_for('disp_courses') }}" class="text-gray-600 hover:text-teal-500 transition-colors">Courses</a>
              </li>
              <li>
                <a href="{{ url_for('disp_forum') }}" class="text-gray-600 hover:text-teal-500 transition-colors">Forum</a>
              </li>
              <li>
                <a href="{{ url_for('auth.logout_get') }}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full transition-all hover:shadow-md hover:shadow-red-200">Log Out</a>
              </li>
              {% endif %}
            </ul>
        </div>
      </nav>
    </header>

    <main class="content">{% block content %} {% endblock %}</main>

    <script>
      (
        function () {
        var nav = document.getElementById("site-nav");
        if (!nav) return;
        var lastScroll = window.pageYOffset;
        var threshold = 100;
        var ticking = false;

        function onScroll() {
          var current = window.pageYOffset;

          if (current > 8) {
            nav.classList.add("scrolled");
          } else {
            nav.classList.remove("scrolled");
          }

          if (current <= 0) {
            nav.classList.remove("nav-hidden");
            lastScroll = current;
            ticking = false;
            return;
          }

          var delta = current - lastScroll;

          if (delta > 4 && current > threshold) {
            nav.classList.add("nav-hidden");
          } else if (delta < -4) {
            nav.classList.remove("nav-hidden");
          }

          lastScroll = current;
          ticking = false;
        }

        window.addEventListener(
          "scroll",
          function () {
            if (!ticking) {
              window.requestAnimationFrame(onScroll);
              ticking = true;
            }
          },
          { passive: true }
        );
      }
    )
    ();
    </script>

    {% block script %} {% endblock %}
  </body>
</html>
