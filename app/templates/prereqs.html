{% extends "header.html" %}

{% block title %}Prerequisite Graph{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto pt-36 pb-10 px-4">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Course Prerequisite Map</h1>
            <p class="text-gray-600">Explore course pre-requisite relationships visually.</p>
        </div>
        <!-- Graph Search Control -->
        <div class="relative w-full md:w-80">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <svg class="w-4 h-4 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </span>
            <input type="text" id="graph-search-input" placeholder="Search course to zoom..." 
                   class="w-full pl-9 pr-4 py-2 text-sm bg-white border border-teal-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition duration-150 shadow-sm" />
            <div id="graph-search-dropdown" class="absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-60 overflow-y-auto hidden z-50">
            </div>
        </div>
    </div>
    
    <div id="graph-container" class="bg-white border border-gray-200 rounded-lg shadow-inner overflow-hidden" style="height: 900px;">
        </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="{{ url_for('static', filename='js/prereq_graph.js') }}"></script>
{% endblock %}
